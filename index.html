<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serenity观点地图</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>
:root{--bg:#0b1018;--panel:#111a26;--line:#263548;--text:#edf3fa;--muted:#8fa0b5;--cyan:#64d8cb;--amber:#f2b65d;--pink:#f1789d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1440px;margin:auto;padding:30px 22px 48px}.top{display:flex;justify-content:space-between;align-items:end;gap:18px}.title{font-size:clamp(30px,4vw,48px);margin:0}.source,.hint,.note,.foot{color:var(--muted)}.source{font-size:12px;text-align:right}.source a{color:var(--cyan)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.controls button,.controls select,.ticker-input,.controls label input{background:transparent;color:var(--text);border:1px solid var(--line);padding:8px 11px;border-radius:7px;height:38px}.controls label{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}.controls label input{min-width:140px;color-scheme:dark}.controls button{cursor:pointer;color:var(--muted)}.controls button.active{background:var(--cyan);color:#071318;border-color:var(--cyan);font-weight:700}.ticker-input{min-width:200px;background:#111a26!important}.plot{height:640px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);gap:18px;align-items:stretch}.panel{height:560px;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:18px;display:flex;flex-direction:column;overflow:hidden}.panel h2{font-size:16px;margin:0 0 5px}.hint{font-size:12px;margin-bottom:14px}.timeline{height:auto;min-height:0;flex:1;overflow:auto;display:grid;align-content:start;gap:10px;padding-right:4px}.event{border-left:2px solid var(--line);padding:5px 8px 7px 13px;cursor:pointer}.event:hover{border-left-color:var(--cyan);background:#152333}.date{font-size:11px;color:var(--cyan);font-weight:700}.ticker{color:var(--amber);font-weight:700;margin-left:8px}.event p{margin:4px 0;color:#d8e1ed}.bull{color:var(--cyan)}.bear{color:var(--pink)}.neutral{color:var(--amber)}table{width:100%;border-collapse:collapse}th,td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-size:11px}.pos{color:var(--cyan)}.neg{color:var(--pink)}.foot{font-size:11px;margin-top:18px}.modal-backdrop{position:fixed;inset:0;background:#03070ccc;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{width:min(760px,100%);background:var(--panel);border:1px solid #3a5068;border-radius:8px;padding:22px}.modal-head{display:flex;justify-content:space-between}.close{border:0;background:transparent;color:var(--muted);font-size:24px;cursor:pointer}.modal-meta{color:var(--muted);font-size:12px;margin:8px 0 16px}.modal-text{white-space:pre-wrap;max-height:min(58vh,600px);overflow:auto;line-height:1.65}.modal-link{display:inline-block;margin-top:16px;color:var(--cyan)}@media(max-width:800px){.wrap{padding:20px 14px 34px}.top{display:block}.source{text-align:left;margin-top:12px}.grid{grid-template-columns:1fr}.plot{height:520px}.panel{height:500px}.controls label{width:calc(50% - 4px)}.controls label input{min-width:0;width:100%}}
</style></head><body><main class="wrap"><div class="top"><h1 class="title">Serenity观点地图</h1><div class="source"><a href="https://x.com/aleabitoreddit" target="_blank" rel="noreferrer">@aleabitoreddit</a><br>日线行情 · 公开观点归档</div></div><div class="controls"><button class="active" data-mode="relative">相对涨跌</button><button data-mode="price">绝对价格</button><select id="rangeSelect"><option value="3">最近 3 个月</option><option value="6">最近 6 个月</option><option value="12">最近 1 年</option><option value="all">全部历史</option></select><label>开始 <input id="startDateInput" type="date"></label><label>结束 <input id="endDateInput" type="date"></label><select id="tickerInput" class="ticker-input" aria-label="选择标的"><option value="AAOI">AAOI</option></select></div><div id="chart" class="plot"></div><div class="grid"><section class="panel"><h2>观点时间线</h2><div class="hint">个股只显示直接相关观点；QQQ 显示全部归档观点。点击记录查看原文与完整中文译文。</div><div id="timeline" class="timeline"></div></section><section class="panel"><h2>区间表现</h2><div class="hint">与图表使用相同的起止日期。点击标的名称也可切换。</div><div style="min-height:0;flex:1;overflow:auto"><table><thead><tr><th>标的</th><th>提及</th><th>表现</th></tr></thead><tbody id="perf"></tbody></table></div></section></div><div class="foot">观点来自公开归档，不能证明覆盖 X 的已删除帖、受限帖或未归档内容。日线仅供研究，不构成投资建议。</div></main><div id="modalBackdrop" class="modal-backdrop"><div class="modal"><div class="modal-head"><h3 id="modalTitle">观点详情</h3><button id="closeModal" class="close">×</button></div><div id="modalMeta" class="modal-meta"></div><div id="modalText" class="modal-text"></div><a id="modalLink" class="modal-link" target="_blank" rel="noreferrer">打开 X 原帖 ↗</a></div></div><script src="app.js"></script></body></html>
