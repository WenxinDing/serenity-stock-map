name: Daily data refresh and Cloudflare deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      translation_mode:
        description: "daily only translates recent missing posts; backfill translates the full archive"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - backfill
      translation_limit:
        description: "Daily translation count (ignored by backfill)"
        required: false
        default: "20"
        type: string

permissions:
  contents: write

# Refresh the public static deployment once per day.

jobs:
  deploy-pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: serenity-stock-map
          branch: main
          directory: .

  refresh-and-deploy:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh market data and coverage
        run: |
          python build_market.py
          python build_archive_ui.py
      - name: Translate new archive posts
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.translation_mode }}" = "backfill" ]; then
            python build_translations.py --backfill
          else
            python build_translations.py --limit "${{ inputs.translation_limit || '20' }}"
          fi
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data.json coverage.json translations.json archive-ui.json
          git diff --cached --quiet || git commit -m "chore: refresh daily market data"
          git push
